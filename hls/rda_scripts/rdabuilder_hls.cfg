# Design-related parameters
--design_language=$RDA_DESIGN_LANGUAGE
--includes=$RDA_INC_DIRS
--rdasc::_pre_includes=$RDA_SYSC_PRE_INC_DIRS
--rdacoverage::_pre_includes=$RDA_SYSC_PRE_INC_DIRS
--defines=$RDA_BUILD_DEFINES
--design_files=$RDA_DESIGN_FILE

# Schedule settings
--target=reference_7nm
--clock_period_ps=$CLK_PERIOD_PS
--constraints_relaxation_kind=clock_period
--flop_inputs=false
--flop_outputs=true
--adaptive_optimization=None

# Code output settings
--use_system_verilog=True
--single_rtl_file=True
--source_annotation_strategy=comment_inline_with_source
--preserve_structs=True

# Builder flow settings
--use_relative_paths=false
--advice_level=basic
--parallel_jobs=1
--verbosity_level=verbose
--analyzer::enable_post_analysis=false
--low_power_optimization=true
